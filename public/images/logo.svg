<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <style>
      .hospedaje-text {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 50px;
        font-weight: 400;
        fill: #ffffff;
        letter-spacing: 2px;
      }
      .salinas-text {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 50px;
        font-weight: 400;
        fill: #5A9FD4;
        letter-spacing: 2px;
      }
      .subtitle-text {
        font-family: 'Arial', sans-serif;
        font-size: 28px;
        font-weight: 400;
        fill: #ffffff;
        letter-spacing: 9px;
        text-transform: uppercase;
      }
      .dot {
        fill: #5A9FD4;
      }
    </style>
  </defs>

  <!-- Fondo transparente (se adapta al fondo del header) -->

  <!-- Texto principal HOSPEDAJE (blanco) -->
  <text x="25" y="70" class="hospedaje-text">HOSPEDAJE</text>

  <!-- Texto principal SALINAS (azul) - más separado -->
  <text x="360" y="70" class="salinas-text">SALINAS</text>

  <!-- Punto decorativo sobre la i de SALINAS -->
  <circle cx="467" cy="28" r="5" class="dot"/>

  <!-- Subtítulo ALQUILERES TURÍSTICOS -->
  <text x="30" y="125" class="subtitle-text">ALQUILERES TURÍSTICOS</text>
</svg>
