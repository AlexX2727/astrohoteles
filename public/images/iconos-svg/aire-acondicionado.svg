<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="acGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- AC Unit -->
  <rect x="12" y="16" width="40" height="24" rx="3" fill="url(#acGrad)" filter="url(#shadow)"/>

  <!-- Vents -->
  <line x1="16" y1="22" x2="48" y2="22" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="26" x2="48" y2="26" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="30" x2="48" y2="30" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="34" x2="48" y2="34" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Cold air waves -->
  <path d="M 20 44 Q 20 48, 16 52" stroke="#74b9ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 28 44 Q 28 48, 24 52" stroke="#74b9ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 36 44 Q 36 48, 40 52" stroke="#74b9ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 44 44 Q 44 48, 48 52" stroke="#74b9ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Snowflake symbol -->
  <circle cx="44" cy="24" r="1.5" fill="#ffffff" opacity="0.9"/>
  <line x1="44" y1="20" x2="44" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="40" y1="24" x2="48" y2="24" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="41.5" y1="21.5" x2="46.5" y2="26.5" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="41.5" y1="26.5" x2="46.5" y2="21.5" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
</svg>
