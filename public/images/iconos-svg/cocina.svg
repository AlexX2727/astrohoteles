<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="kitchenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Stove Body -->
  <path d="M4 8h16v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8z" stroke="url(#kitchenGrad)" stroke-width="1.8"/>
  <!-- Stove top dividing line -->
  <path d="M4 11h16" stroke="url(#kitchenGrad)" stroke-width="1.8"/>
  <!-- Oven Window -->
  <rect x="7" y="14" width="10" height="5" rx="1" stroke="url(#kitchenGrad)" stroke-width="1.5" fill="rgba(234, 88, 12, 0.08)"/>
  <!-- Knobs -->
  <circle cx="7" cy="9.5" r="0.8" fill="url(#kitchenGrad)"/>
  <circle cx="10" cy="9.5" r="0.8" fill="url(#kitchenGrad)"/>
  <circle cx="14" cy="9.5" r="0.8" fill="url(#kitchenGrad)"/>
  <circle cx="17" cy="9.5" r="0.8" fill="url(#kitchenGrad)"/>
  
  <!-- Frying Pan on top -->
  <path d="M7 8H13V7.5A0.5 0.5 0 0 0 12.5 7H7.5A0.5 0.5 0 0 0 7 7.5V8z" fill="url(#kitchenGrad)"/>
  <path d="M6 7h8" stroke="url(#kitchenGrad)" stroke-width="1.5"/>
  <path d="M6 7v1a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V7" stroke="url(#kitchenGrad)" stroke-width="1.5"/>
  <!-- Pan Handle -->
  <path d="M14 7.5l4 -2" stroke="url(#kitchenGrad)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Steam from pan -->
  <path d="M8 4c0-1-1-1-1-2" stroke="url(#kitchenGrad)" stroke-width="1.2" opacity="0.7"/>
  <path d="M11 3c0-1 1-1 1-2" stroke="url(#kitchenGrad)" stroke-width="1.2" opacity="0.7"/>
</svg>
