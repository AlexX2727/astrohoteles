<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .h-letter {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 60px;
        font-weight: 700;
        fill: #ffffff;
      }
      .s-letter {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 60px;
        font-weight: 700;
        fill: #5A9FD4;
      }
    </style>
  </defs>

  <!-- Fondo oscuro -->
  <rect width="100" height="100" fill="#0a0a0a"/>

  <!-- Letra H (blanca) -->
  <text x="15" y="68" class="h-letter">H</text>

  <!-- Letra S (azul) -->
  <text x="52" y="68" class="s-letter">S</text>

  <!-- Punto decorativo -->
  <circle cx="50" cy="85" r="3" fill="#5A9FD4"/>
</svg>
